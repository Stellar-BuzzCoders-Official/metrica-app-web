databases:
  - name: metrica-db
    plan: free
    region: ohio

services:
  # Backend (FastAPI)
  - type: web
    name: metrica-backend
    env: python
    region: ohio
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metrica-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
    
  # Frontend (Angular 18+)
  - type: web
    name: metrica-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build -- --configuration production"
    staticPublishPath: "./frontend/dist/frontend/browser"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://metrica-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
